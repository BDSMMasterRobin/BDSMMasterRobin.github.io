      gap:.5rem;
      color:var(--muted);
      font-size:.85rem;
      font-weight:700;

    .language-switcher select {
      width:auto;
      min-width:125px;
      padding:.5rem .75rem;
      border-radius:999px;

      border-radius:24px;
      background:rgba(33,26,45,.93);

      padding:clamp(1.5rem,3vw,3rem);

    .fields {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:1rem;

    label {

      gap:.4rem;
      color:var(--muted);
      font-weight:700;

      padding:.75rem .85rem;

      min-height:96px;

    select:focus,
    textarea:focus,

    a:focus-visible {

      outline-offset:2px;

      margin:0 0 .7rem;
      font-size:.9rem;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.09em;

      overflow:hidden;
      min-height:400px;
      padding:1.5rem;
      border:1px solid #d6afff;
      border-radius:22px;
      color:#24132e;
      background:linear-gradient(135deg,#f8eaff,#c699f6 49%,#ffb3cf);
      box-shadow:0 18px 36px #0004;
    }

    .card:before {
      content:"";
      position:absolute;
      width:260px;
      height:260px;
      border:35px solid #ffffff55;
      border-radius:50%;
      right:-90px;
      top:-105px;

    .card > * { position:relative; }

    .card-top {

      justify-content:space-between;
      gap:1rem;
      align-items:start;
      border-bottom:1px solid #4b216466;
      padding-bottom:.9rem;

    .card-title {

      font-size:1.6rem;
      line-height:1;
    }

    .badge {
      display:grid;
      place-items:center;
      width:54px;
      aspect-ratio:1;
      border-radius:50%;
      background:#40155c;
      color:#fff;
      font-weight:900;
      font-size:1.3rem;
    }

    .identity {
      display:grid;
      grid-template-columns:92px 1fr;
      gap:1rem;
      margin:1.4rem 0;
      align-items:center;
    }

    .avatar {
      display:grid;
      place-items:center;
      width:92px;
      aspect-ratio:1;
      border-radius:18px;
      background:#51206d;
      color:white;
      font-size:2rem;
      font-weight:900;

    .name {
      margin:0;
      font-size:clamp(1.6rem,5vw,2.45rem);
      line-height:1;
      overflow-wrap:anywhere;
    }

    .role {
      margin:.4rem 0 0;
      font-weight:800;
      color:#54226e;
    }

    .details {
      display:grid;
      gap:.75rem;
    }

    .detail {
      padding:.65rem .75rem;
      border-radius:12px;
      background:#fff8;
    }

    .detail strong {
      display:block;
      color:#582276;
      font-size:.72rem;
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    .detail span { overflow-wrap:anywhere; }

    .preferences {
      grid-column:1 / -1;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:16px;
      background:#101827;

    .social-media-fields { padding:1rem; }

    .preferences-heading {

      border-bottom:1px solid #344155;
      background:#1d2939;

    .preferences h3 {

      font-size:1.08rem;

    .preference-list {

    .preference-table {

      text-align:center;

    .preference-name {

    .preference-option {

      place-items:center;

      inline-size:1px;
      block-size:1px;
      opacity:0;

    .preference-dot {
      width:19px;
      aspect-ratio:1;
      border:1px solid currentColor;
      border-radius:50%;
      transition:

        box-shadow .15s ease,
        background .15s ease;

      transform:scale(1.13);

      outline:2px solid var(--ink);
      outline-offset:3px;

      .share-row { flex-direction:column; }

      .language-switcher { justify-content:center; }

      .preference-table {
        min-width:0;
        table-layout:fixed;
        font-size:.72rem;

      .preference-table th {
        padding:.35rem .1rem;
        font-size:.62rem;
        line-height:1.15;
        overflow-wrap:anywhere;

      .preference-table th:first-child {
        width:calc(100% - 9rem);
      }

      .preference-name {
        padding:.45rem .35rem;
        line-height:1.2;
      }

      .preference-option {
        width:1.5rem;
        padding:.25rem 0;
      }

  </style>
</head>

function setLanguage(language) {

  currentLanguage =
    language === 'de' ? 'de' : 'en';

    'slave-id-language',

    document.querySelector('#page-subtitle');

    label.textContent = t('language');
  }

  if (title) {
    title.textContent = t('pageTitle');
  }

  if (subtitle) {
    subtitle.textContent = t('pageSubtitle');

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(value || '').replace(
    /[&<>'"]/g,
    character => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    })[character]
  );

}


function localizedPreferenceQuestion(question,index) {

  if (currentLanguage === 'de') {
    return question;
  }

  return preferenceQuestionsEN[index] || question;

}


/* =========================================================
   COMPACT LINK ENCODING
========================================================= */

function encode(data) {

  const preferences = [];

  Object.entries(data.preferences || {}).forEach(
    ([questionIndex,choice]) => {

      const choiceIndex =
        preferenceChoices.indexOf(choice);

      if (
        /^\d+$/.test(questionIndex) &&
        choiceIndex !== -1 &&
        Number(questionIndex) >= 0 &&
        Number(questionIndex) < preferenceQuestions.length
      ) {

        preferences.push(
          Number(questionIndex),
          choiceIndex
        );

      }

    }
  );


  const compactData = [

    data.name || '',
    data.birthdate || '',
    data.gender || '',
    data.x || '',
    data.instagram || '',
    data.reddit || '',
    data.fet || '',
    data.recon || '',
    data.bluesky || '',
    currentLanguage,
    preferences

  ];


  return LZString.compressToEncodedURIComponent(
    JSON.stringify(compactData)
  );

}


/* =========================================================
   DECODING
========================================================= */

function decode(value) {

  const decompressed =
    LZString.decompressFromEncodedURIComponent(value);

  if (!decompressed) {
    throw new Error('Link could not be decoded.');
  }

  const parsed = JSON.parse(decompressed);


  if (Array.isArray(parsed)) {

    const compactData = parsed;

    const name = compactData[0] || '';
    const birthdate = compactData[1] || '';
    const gender = compactData[2] || '';
    const x = compactData[3] || '';
    const instagram = compactData[4] || '';
    const reddit = compactData[5] || '';
    const fet = compactData[6] || '';
    const recon = compactData[7] || '';
    const bluesky = compactData[8] || '';

    let language = 'en';
    let preferenceArray = [];

    if (
      compactData[9] === 'de' ||
      compactData[9] === 'en'
    ) {

      language = compactData[9];

      preferenceArray =
        Array.isArray(compactData[10])
          ? compactData[10]
          : [];

    } else {

      preferenceArray =
        Array.isArray(compactData[9])
          ? compactData[9]
          : [];

    }


    const preferences = {};

    for (
      let i = 0;
      i + 1 < preferenceArray.length;
      i += 2
    ) {

      const questionIndex =
        Number(preferenceArray[i]);

      const choiceIndex =
        Number(preferenceArray[i + 1]);

      if (
        Number.isInteger(questionIndex) &&
        Number.isInteger(choiceIndex) &&
        questionIndex >= 0 &&
        questionIndex < preferenceQuestions.length &&
        choiceIndex >= 0 &&
        choiceIndex < preferenceChoices.length
      ) {

        preferences[questionIndex] =
          preferenceChoices[choiceIndex];

      }

    }


    return {
      name,
      birthdate,
      gender,
      x,
      instagram,
      reddit,
      fet,
      recon,
      bluesky,
      language,
      preferences
    };

  }


  if (
    parsed &&
    typeof parsed === 'object'
  ) {

    return {

      name:
        typeof parsed.name === 'string'
          ? parsed.name
          : '',

      birthdate:
        typeof parsed.birthdate === 'string'
          ? parsed.birthdate
          : '',

      gender:
        typeof parsed.gender === 'string'
          ? parsed.gender
          : '',

      x:
        typeof parsed.x === 'string'
          ? parsed.x
          : '',

      instagram:
        typeof parsed.instagram === 'string'
          ? parsed.instagram
          : '',

      reddit:

          ? parsed.reddit
          : '',

      fet:

          ? parsed.fet
          : '',

      recon:
        typeof parsed.recon === 'string'
          ? parsed.recon
          : '',

      bluesky:
        typeof parsed.bluesky === 'string'
          ? parsed.bluesky
          : '',

      language:
        parsed.language === 'de'
          ? 'de'
          : 'en',

      preferences:
        parsed.preferences &&
        typeof parsed.preferences === 'object'
          ? parsed.preferences
          : {}

    };

  }


  throw new Error('Invalid data format.');

}

function initials(name) {

  return (
    name
      .trim()
      .split(/\s+/)
      .map(word => word[0])
      .join('')
      .slice(0,2) ||
    'S'
  ).toUpperCase();

}


function selectedPreferences(data) {

  return preferenceQuestions
    .map((question,index) => [
      localizedPreferenceQuestion(question,index),
      data.preferences?.[index]
    ])
    .filter(
      ([,answer]) =>
        preferenceChoices.includes(answer)
    );

}


function ageFromBirthdate(
  birthdate,
  today = new Date()
) {

  if (!/^\d{4}-\d{2}-\d{2}$/.test(birthdate)) {
    return null;
  }

  const [year,month,day] =
    birthdate.split('-').map(Number);

  const birthday =
    new Date(year,month - 1,day);

  if (
    birthday.getFullYear() !== year ||
    birthday.getMonth() !== month - 1 ||
    birthday.getDate() !== day ||
    birthday > today
  ) {
    return null;
  }

  let age =
    today.getFullYear() - year;

  if (
    today.getMonth() < month - 1 ||
    (
      today.getMonth() === month - 1 &&
      today.getDate() < day
    )
  ) {
    age--;
  }

  return age;

}

function readForm() {

  const data =
    Object.fromEntries(

      Object.keys(defaults)

        .filter(
          key => key !== 'preferences'
        )

        .map(
          key => {

            const field =
              document.querySelector(
                `[name="${key}"]`
              );

            return [
              key,
              field ? field.value : ''
            ];

          }
        )

    );


  data.preferences =
    Object.fromEntries(

      [
        ...app.querySelectorAll(
          '[data-preference]:checked'
        )
      ]

      .map(
        input => [
          input.dataset.preference,
          input.value
        ]
      )

    );


  return data;

}

      alert(t('copyFallback'));

    }

  }

}

function imageFileName(name) {

      );

/* =========================================================
   CANVAS HELPERS
========================================================= */

function canvasRoundRect(
  ctx,
  x,
  y,
  width,
  height,
  radius
) {

  const r =
    Math.min(
      radius,
      width / 2,
      height / 2
    );

  ctx.beginPath();

  ctx.moveTo(x + r,y);

  ctx.lineTo(
    x + width - r,
    y
  );

  ctx.quadraticCurveTo(
    x + width,
    y,
    x + width,
    y + r
  );

  ctx.lineTo(
    x + width,
    y + height - r
  );

  ctx.quadraticCurveTo(
    x + width,
    y + height,
    x + width - r,
    y + height
  );

  ctx.lineTo(
    x + r,
    y + height
  );

  ctx.quadraticCurveTo(
    x,
    y + height,
    x,
    y + height - r
  );

  ctx.lineTo(
    x,
    y + r
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x + r,
    y
  );

  ctx.closePath();

}


function fillRoundRect(
  ctx,
  x,
  y,
  width,
  height,
  radius,
  fill
) {

  canvasRoundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
  );

  ctx.fillStyle = fill;
  ctx.fill();

}


function strokeRoundRect(
  ctx,
  x,
  y,
  width,
  height,
  radius,
  stroke,
  lineWidth = 1
) {

  canvasRoundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
  );

  ctx.strokeStyle = stroke;
  ctx.lineWidth = lineWidth;
  ctx.stroke();

}


function canvasTextWidth(ctx,text) {

  return ctx.measureText(
    String(text)
  ).width;

}


function wrapCanvasText(
  ctx,
  text,
  maxWidth
) {

  const words =
    String(text || '')
      .split(/\s+/)
      .filter(Boolean);


  if (!words.length) {
    return [''];
  }


  const lines = [];
  let current = '';


  for (const word of words) {

    const test =
      current
        ? `${current} ${word}`
        : word;


    if (
      canvasTextWidth(
        ctx,
        test
      ) <= maxWidth
    ) {

      current = test;

    } else {

      if (current) {
        lines.push(current);
      }

      current = word;

    }

  }


  if (current) {
    lines.push(current);
  }


  return lines;

}


/* =========================================================
   CANVAS CHIP
========================================================= */

function drawCanvasChip(
  ctx,
  text,
  x,
  y,
  maxWidth,
  options = {}
) {

  const {
    font='700 16px Arial, sans-serif',
    textColor='#24132e',
    background='rgba(255,255,255,.53)',
    paddingX=12,
    paddingY=8,
    radius=999
  } = options;


  ctx.font = font;


  const availableTextWidth =
    Math.max(
      30,
      maxWidth - paddingX * 2
    );


  const lines =
    wrapCanvasText(
      ctx,
      text,
      availableTextWidth
    );


  const visibleLines =
    lines.slice(0,2);


  if (
    lines.length > 2 &&
    visibleLines.length
  ) {

    let last =
      visibleLines[
        visibleLines.length - 1
      ];

    while (
      canvasTextWidth(
        ctx,
        `${last}…`
      ) > availableTextWidth &&
      last.length > 1
    ) {

      last =
        last.slice(0,-1);

    }

    visibleLines[
      visibleLines.length - 1
    ] =
      `${last}…`;

  }


  const lineHeight = 21;


  let textWidth = 0;

  visibleLines.forEach(line => {

    textWidth =
      Math.max(
        textWidth,
        canvasTextWidth(
          ctx,
          line
        )
      );

  });


  const chipWidth =
    Math.min(
      maxWidth,
      Math.max(
        60,
        textWidth + paddingX * 2
      )
    );


  const chipHeight =
    visibleLines.length *
      lineHeight +
    paddingY * 2;


  fillRoundRect(
    ctx,
    x,
    y,
    chipWidth,
    chipHeight,
    Math.min(
      radius,
      chipHeight / 2
    ),
    background
  );


  ctx.fillStyle =
    textColor;

  ctx.textBaseline =
    'top';


  visibleLines.forEach(
    (line,index) => {

      ctx.fillText(
        line,
        x + paddingX,
        y +
          paddingY +
          index * lineHeight
      );

    }
  );


  return {
    width:chipWidth,
    height:chipHeight
  };

}


/* =========================================================
   CANVAS CHIP LIST
========================================================= */

function drawCanvasChipList(
  ctx,
  items,
  x,
  y,
  width,
  options = {}
) {

  const {
    gap=9,
    rowGap=9,
    font='700 16px Arial, sans-serif',
    textColor='#24132e',
    background='rgba(255,255,255,.53)',
    paddingX=12,
    paddingY=8
  } = options;


  let currentX = x;
  let currentY = y;
  let rowHeight = 0;


  for (const item of items) {

    /*
      Erst mit der maximal verfügbaren
      Breite messen.
    */

    const measured =
      drawCanvasChip(
        ctx,
        item,
        0,
        0,
        width,
        {
          font,
          textColor,
          background,
          paddingX,
          paddingY
        }
      );


    /*
      Passt der Chip nicht mehr in die
      aktuelle Zeile, beginnt eine neue.
    */

    if (
      currentX !== x &&
      currentX +
        measured.width >
        x + width
    ) {

      currentX = x;

      currentY +=
        rowHeight + rowGap;

      rowHeight = 0;

    }


    const remainingWidth =
      x +
      width -
      currentX;


    const chip =
      drawCanvasChip(
        ctx,
        item,
        currentX,
        currentY,
        remainingWidth,
        {
          font,
          textColor,
          background,
          paddingX,
          paddingY
        }
      );


    currentX +=
      chip.width + gap;


    rowHeight =
      Math.max(
        rowHeight,
        chip.height
      );

  }


  return {
    y:currentY + rowHeight,
    height:
      currentY +
      rowHeight -
      y
  };

}


/* =========================================================
   CANVAS CARD RENDERER
========================================================= */

async function renderCardToCanvas(data) {

  /*
    Feste Exportbreite.
    Dadurch bleibt die PNG-Größe unabhängig
    von Bildschirmbreite und Zoom.
  */

  const width = 1200;
  const padding = 48;
  const contentWidth =
    width - padding * 2;

  const scale = 2;


  const name =
    String(data.name || '').trim() ||
    (
      currentLanguage === 'en'
        ? 'Your name'
        : 'Dein Name'
    );


  const age =
    ageFromBirthdate(
      data.birthdate
    );


  const gender =
    String(data.gender || '').trim() ||
    t('genderNotSpecified');


  const selections =
    selectedPreferences(data);


  const socialMedia =
    socialMediaFields.filter(
      ([key]) =>
        String(data[key] || '').trim()
    );


  /*
    Die Canvas-Höhe wird zunächst großzügig
    angelegt. Anschließend wird auf die
    tatsächlich benötigte Höhe zugeschnitten.
  */

  const canvas =
    document.createElement('canvas');


  canvas.width =
    width * scale;

  canvas.height =
    4000 * scale;


  const ctx =
    canvas.getContext('2d');


  if (!ctx) {
    throw new Error(
      'Canvas is not supported.'
    );
  }


  ctx.scale(scale,scale);


  ctx.textBaseline =
    'alphabetic';


  /*
    -------------------------------------------------------
    BACKGROUND
    -------------------------------------------------------
  */

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      width,
      1000
    );


  gradient.addColorStop(
    0,
    '#f8eaff'
  );

  gradient.addColorStop(
    .49,
    '#c699f6'
  );

  gradient.addColorStop(
    1,
    '#ffb3cf'
  );


  const temporaryHeight =
    3900;


  fillRoundRect(
    ctx,
    0,
    0,
    width,
    temporaryHeight,
    44,
    gradient
  );


  strokeRoundRect(
    ctx,
    .5,
    .5,
    width - 1,
    temporaryHeight - 1,
    44,
    '#d6afff',
    2
  );


  /*
    -------------------------------------------------------
    DECORATIVE CIRCLE
    -------------------------------------------------------
  */

  ctx.save();

  ctx.beginPath();

  ctx.arc(
    width - 5,
    -5,
    145,
    0,
    Math.PI * 2
  );

  ctx.lineWidth = 35;

  ctx.strokeStyle =
    'rgba(255,255,255,.33)';

  ctx.stroke();

  ctx.restore();


  /*
    -------------------------------------------------------
    TOP
    -------------------------------------------------------
  */

  let y = padding;


  ctx.fillStyle =
    '#24132e';

  ctx.font =
    '900 32px Arial, sans-serif';


  ctx.fillText(
    t('cardTitle'),
    padding,
    y + 31
  );


  /*
    AGE BADGE
  */

  const badgeSize = 108;

  const badgeX =
    width -
    padding -
    badgeSize;

  const badgeY =
    y;


  ctx.beginPath();

  ctx.arc(
    badgeX + badgeSize / 2,
    badgeY + badgeSize / 2,
    badgeSize / 2,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    '#40155c';

  ctx.fill();


  ctx.fillStyle =
    '#ffffff';

  ctx.textAlign =
    'center';

  ctx.textBaseline =
    'middle';

  ctx.font =
    '900 30px Arial, sans-serif';


  ctx.fillText(
    age === null
      ? '—'
      : `${age} ${t('years')}`,
    badgeX + badgeSize / 2,
    badgeY + badgeSize / 2
  );


  ctx.textAlign =
    'left';

  ctx.textBaseline =
    'alphabetic';


  /*
    DIVIDER
  */

  y += 75;


  ctx.strokeStyle =
    'rgba(75,33,100,.40)';

  ctx.lineWidth = 1;

  ctx.beginPath();

  ctx.moveTo(
    padding,
    y
  );

  ctx.lineTo(
    width - padding,
    y
  );

  ctx.stroke();


  /*
    -------------------------------------------------------
    IDENTITY
    -------------------------------------------------------
  */

  y += 38;


  const avatarSize = 140;


  fillRoundRect(
    ctx,
    padding,
    y,
    avatarSize,
    avatarSize,
    25,
    '#51206d'
  );


  ctx.fillStyle =
    '#ffffff';

  ctx.textAlign =
    'center';

  ctx.textBaseline =
    'middle';

  ctx.font =
    '900 48px Arial, sans-serif';


  ctx.fillText(
    initials(name),
    padding + avatarSize / 2,
    y + avatarSize / 2
  );


  ctx.textAlign =
    'left';

  ctx.textBaseline =
    'alphabetic';


  const identityX =
    padding +
    avatarSize +
    28;


  const identityWidth =
    width -
    identityX -
    padding;


  ctx.fillStyle =
    '#24132e';

  ctx.font =
    '900 52px Arial, sans-serif';


  const nameLines =
    wrapCanvasText(
      ctx,
      name,
      identityWidth
    );


  let identityTextY =
    y + 51;


  nameLines
    .slice(0,3)
    .forEach(line => {

      ctx.fillText(
        line,
        identityX,
        identityTextY
      );

      identityTextY += 58;

    });


  ctx.fillStyle =
    '#54226e';

  ctx.font =
    '800 24px Arial, sans-serif';


  ctx.fillText(
    gender,
    identityX,
    identityTextY + 4
  );


  y +=
    avatarSize + 34;


  /*
    -------------------------------------------------------
    DETAIL BOX HELPER
    -------------------------------------------------------
  */

  function beginDetail(title,height) {

    fillRoundRect(
      ctx,
      padding,
      y,
      contentWidth,
      height,
      18,
      'rgba(255,255,255,.53)'
    );


    ctx.fillStyle =
      '#582276';

    ctx.font =
      '800 16px Arial, sans-serif';


    ctx.fillText(
      title.toUpperCase(),
      padding + 18,
      y + 27
    );

  }


  /*
    -------------------------------------------------------
    SOCIAL MEDIA
    -------------------------------------------------------
  */

  if (socialMedia.length) {

    const socialItems =
      socialMedia.map(
        ([key,label]) =>
          `${label}: ${String(
            data[key] || ''
          ).trim()}`
      );


    /*
      Für die tatsächliche Höhe werden
      die Chips wirklich gezeichnet.
    */

    ctx.font =
      '700 16px Arial, sans-serif';


    /*
      Zuerst auf einer unsichtbaren Position
      messen. Dabei wird dieselbe Logik wie
      beim eigentlichen Zeichnen verwendet.
    */

    const measurementCanvas =
      document.createElement('canvas');

    measurementCanvas.width =
      width * scale;

    measurementCanvas.height =
      2000 * scale;


    const measurementContext =
      measurementCanvas.getContext('2d');


    measurementContext.scale(
      scale,
      scale
    );


    const socialMeasurement =
      drawCanvasChipList(
        measurementContext,
        socialItems,
        18,
        0,
        contentWidth - 36,
        {
          font:'700 16px Arial, sans-serif',
          paddingX:12,
          paddingY:8,
          rowGap:9,
          gap:9
        }
      );


    const socialHeight =
      39 +
      socialMeasurement.height +
      18;


    beginDetail(
      t('socialMediaCard'),
      socialHeight
    );


    drawCanvasChipList(
      ctx,
      socialItems,
      padding + 18,
      y + 39,
      contentWidth - 36,
      {
        font:'700 16px Arial, sans-serif',
        paddingX:12,
        paddingY:8,
        rowGap:9,
        gap:9
      }
    );


    y +=
      socialHeight + 14;

  }


  /*
    -------------------------------------------------------
    PREFERENCES
    -------------------------------------------------------
  */

  if (selections.length) {

    const preferenceItems =
      selections.map(
        ([question,answer]) =>
          `${question}: ${answer}`
      );


    const measurementCanvas =
      document.createElement('canvas');

    measurementCanvas.width =
      width * scale;

    measurementCanvas.height =
      12000 * scale;


    const measurementContext =
      measurementCanvas.getContext('2d');


    measurementContext.scale(
      scale,
      scale
    );


    const preferenceMeasurement =
      drawCanvasChipList(
        measurementContext,
        preferenceItems,
        18,
        0,
        contentWidth - 36,
        {
          font:'700 16px Arial, sans-serif',
          paddingX:12,
          paddingY:8,
          rowGap:9,
          gap:9
        }
      );


    const preferenceHeight =
      39 +
      preferenceMeasurement.height +
      18;


    beginDetail(
      t('preferencesCard'),
      preferenceHeight
    );


    drawCanvasChipList(
      ctx,
      preferenceItems,
      padding + 18,
      y + 39,
      contentWidth - 36,
      {
        font:'700 16px Arial, sans-serif',
        paddingX:12,
        paddingY:8,
        rowGap:9,
        gap:9
      }
    );


    y +=
      preferenceHeight + 14;

  }


  /*
    -------------------------------------------------------
    FINAL HEIGHT
    -------------------------------------------------------
  */

  const finalHeight =
    Math.max(
      400,
      Math.ceil(y + padding)
    );


  /*
    Canvas auf die tatsächlich benötigte
    Höhe zuschneiden.
  */

  const imageData =
    ctx.getImageData(
      0,
      0,
      width * scale,
      Math.ceil(
        finalHeight * scale
      )
    );


  const finalCanvas =
    document.createElement('canvas');


  finalCanvas.width =
    width * scale;

  finalCanvas.height =
    Math.ceil(
      finalHeight * scale
    );


  const finalContext =
    finalCanvas.getContext('2d');


  if (!finalContext) {
    throw new Error(
      'Canvas context could not be created.'
    );
  }


  finalContext.putImageData(
    imageData,
    0,
    0
  );


  return finalCanvas;

}


/* =========================================================
   DOWNLOAD CANVAS
========================================================= */

function downloadCanvas(
  canvas,
  filename
) {

  return new Promise(
    (resolve,reject) => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            reject(
              new Error(
                'PNG could not be created.'
              )
            );

            return;

          }


          const url =
            URL.createObjectURL(blob);


          const link =
            document.createElement('a');


          link.href =
            url;

          link.download =
            filename;


          /*
            Der Link wird kurz in den DOM
            eingefügt. Das ist insbesondere
            für Firefox/Safari zuverlässiger.
          */

          document.body.appendChild(
            link
          );


          link.click();


          link.remove();


          setTimeout(
            () =>
              URL.revokeObjectURL(url),
            1000
          );


          resolve();

        },
        'image/png'
      );

    }
  );

}


/* =========================================================
   EXPORT IMAGE
========================================================= */

async function exportImage(
  data = readForm()
) {

  const button =
    app.querySelector(
      '#export-image'
    );


  if (button) {

    button.disabled =
      true;

    button.textContent =
      t('creatingImage');

  }


  try {

    /*
      WICHTIG:
      Hier wird kein SVG und kein
      foreignObject verwendet.

      Die Karte wird vollständig
      direkt mit Canvas gezeichnet.
    */

    const canvas =
      await renderCardToCanvas(
        data
      );


    await downloadCanvas(
      canvas,
      imageFileName(data.name)
    );


  } catch (error) {

    console.error(
      'Image export failed:',
      error
    );


    alert(
      t('imageError')
    );


  } finally {

    if (button) {

      button.disabled =
        false;

      button.textContent =
        t('exportImage');

    }

  }

}

/* =========================================================
   SHARED DATA
========================================================= */

function sharedData() {

  /*
    Unterstützt:

      #a=...
      #ausweis=...
  */

  const match =
    location.hash.match(
      /^#(?:a|ausweis)=([^&]+)$/
    );


  if (!match) {
    return null;
  }


  try {

    const data =
      decode(match[1]);


    /*
      Sprache aus dem Link übernehmen.
    */

    currentLanguage =
      data.language === 'de'
        ? 'de'
        : 'en';


    document.documentElement.lang =
      currentLanguage;


    const sanitized =
      Object.fromEntries(

        Object.keys(defaults)

          .filter(
            key =>
              key !== 'preferences'
          )

          .map(
            key => [

              key,

              typeof data[key] === 'string'
                ? data[key]
                : defaults[key]

            ]
          )

      );


    if (
      sanitized.gender === 'Freitext' &&
      typeof data.genderCustom === 'string'
    ) {

      sanitized.gender =
        data.genderCustom;

    }


    if (
      ageFromBirthdate(
        sanitized.birthdate
      ) === null
    ) {

      return null;

    }


    sanitized.preferences =
      Object.fromEntries(

        Object.entries(
          data.preferences || {}
        )

        .filter(
          ([key,value]) =>

            /^\d+$/.test(key) &&

            Number(key) <
              preferenceQuestions.length &&

            preferenceChoices.includes(
              value
            )

        )

      );


    return sanitized;


  } catch {

    return null;

  }

}
