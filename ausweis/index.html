    .preference-name {

function setLanguage(language) {

  currentLanguage =
    language === 'de'
      ? 'de'
      : 'en';

  localStorage.setItem(
    'slave-id-language',
    currentLanguage
  );

  document.documentElement.lang =
    currentLanguage;

  updateLanguageUI();

  const shared =
    sharedData();

  if (shared) {

    renderShared(shared);

  } else {

    renderEditor();

  }

}


function updateLanguageUI() {

  const select =
    document.querySelector(
      '#language-select'
    );

  if (select) {
    select.value =
      currentLanguage;
  }

  const label =
    document.querySelector(
      '#language-label'
    );

  const title =
    document.querySelector(
      '#page-title'
    );

  const subtitle =
    document.querySelector(
      '#page-subtitle'
    );

  if (label) {
    label.textContent =
      t('language');
  }

  if (title) {
    title.textContent =
      t('pageTitle');
  }

  if (subtitle) {
    subtitle.textContent =
      t('pageSubtitle');
  }

}

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(value || '').replace(
    /[&<>'"]/g,

    character => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'

    })[character]
  );

}


function localizedPreferenceQuestion(
  question,
  index
) {

  if (currentLanguage === 'de') {
    return question;
  }

  return (
    preferenceQuestionsEN[index] ||
    question
  );

}


/* =========================================================
   COMPACT LINK ENCODING
========================================================= */

function encode(data) {

  const preferences = [];

  Object.entries(
    data.preferences || {}
  ).forEach(
    ([questionIndex, choice]) => {

      const choiceIndex =
        preferenceChoices.indexOf(choice);

      if (
        /^\d+$/.test(questionIndex) &&
        choiceIndex !== -1 &&
        Number(questionIndex) >= 0 &&
        Number(questionIndex) < preferenceQuestions.length
      ) {

        preferences.push(
          Number(questionIndex),
          choiceIndex
        );

      }

    }
  );


  /*
    Indexes:

    0  name
    1  birthdate
    2  gender
    3  x
    4  instagram
    5  reddit
    6  fet
    7  recon
    8  bluesky
    9  language
    10 preferences
  */

  const compactData = [

    data.name || '',
    data.birthdate || '',
    data.gender || '',
    data.x || '',
    data.instagram || '',
    data.reddit || '',
    data.fet || '',
    data.recon || '',
    data.bluesky || '',
    currentLanguage,
    preferences

  ];


  return LZString.compressToEncodedURIComponent(
    JSON.stringify(compactData)
  );

}


/* =========================================================
   DECODING
========================================================= */

function decode(value) {

  const decompressed =
    LZString.decompressFromEncodedURIComponent(
      value
    );


  if (!decompressed) {

    throw new Error(
      'Link could not be decoded.'
    );

  }


  const parsed =
    JSON.parse(decompressed);


  /* -------------------------------------------------------
     NEW COMPACT FORMAT
  ------------------------------------------------------- */

  if (Array.isArray(parsed)) {

    const compactData = parsed;

    const name =
      compactData[0] || '';

    const birthdate =
      compactData[1] || '';

    const gender =
      compactData[2] || '';

    const x =
      compactData[3] || '';

    const instagram =
      compactData[4] || '';

    const reddit =
      compactData[5] || '';

    const fet =
      compactData[6] || '';

    const recon =
      compactData[7] || '';

    const bluesky =
      compactData[8] || '';


    /*
      Old compact links had preferences at index 9.

      New links have language at index 9
      and preferences at index 10.
    */

    let language = 'en';

    let preferenceArray = [];


    if (
      compactData[9] === 'de' ||
      compactData[9] === 'en'
    ) {

      language =
        compactData[9];

      preferenceArray =
        Array.isArray(compactData[10])
          ? compactData[10]
          : [];

    } else {

      /*
        Compatibility with the previous
        compact format.
      */

      preferenceArray =
        Array.isArray(compactData[9])
          ? compactData[9]
          : [];

    }


    const preferences = {};


    for (
      let i = 0;
      i + 1 < preferenceArray.length;
      i += 2
    ) {

      const questionIndex =
        Number(preferenceArray[i]);

      const choiceIndex =
        Number(preferenceArray[i + 1]);


      if (
        Number.isInteger(questionIndex) &&
        Number.isInteger(choiceIndex) &&
        questionIndex >= 0 &&
        questionIndex < preferenceQuestions.length &&
        choiceIndex >= 0 &&
        choiceIndex < preferenceChoices.length
      ) {

        preferences[questionIndex] =
          preferenceChoices[choiceIndex];

      }

    }


    return {

      name,
      birthdate,
      gender,
      x,
      instagram,
      reddit,
      fet,
      recon,
      bluesky,
      language,
      preferences

    };

  }


  /* -------------------------------------------------------
     OLD OBJECT FORMAT
  ------------------------------------------------------- */

  if (
    parsed &&
    typeof parsed === 'object'
  ) {

    return {

      name:
        typeof parsed.name === 'string'
          ? parsed.name
          : '',

      birthdate:
        typeof parsed.birthdate === 'string'
          ? parsed.birthdate
          : '',

      gender:
        typeof parsed.gender === 'string'
          ? parsed.gender
          : '',

      x:
        typeof parsed.x === 'string'
          ? parsed.x
          : '',

      instagram:
        typeof parsed.instagram === 'string'

          : '',

          : '',

          : '',

      recon:

          ? parsed.recon
          : '',

      bluesky:
        typeof parsed.bluesky === 'string'
          ? parsed.bluesky
          : '',

      language:
        parsed.language === 'de'
          ? 'de'
          : 'en',

      preferences:
        parsed.preferences &&
        typeof parsed.preferences === 'object'
          ? parsed.preferences
          : {}

    };

  }


  throw new Error(
    'Invalid data format.'
  );

}

function initials(name) {

  return (

    name
      .trim()
      .split(/\s+/)
      .map(
        word => word[0]
      )
      .join('')
      .slice(0,2) ||

    'S'

  ).toUpperCase();

}


function selectedPreferences(data) {

  return preferenceQuestions

    .map(
      (question,index) => [

        localizedPreferenceQuestion(
          question,
          index
        ),

        data.preferences?.[index]

      ]
    )

    .filter(
      ([,answer]) =>
        preferenceChoices.includes(answer)
    );

}


function ageFromBirthdate(
  birthdate,
  today = new Date()
) {

  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(
      birthdate
    )
  ) {

    return null;

  }


  const [
    year,
    month,
    day
  ] =
    birthdate
      .split('-')
      .map(Number);


  const birthday =
    new Date(
      year,
      month - 1,
      day
    );


  if (
    birthday.getFullYear() !== year ||
    birthday.getMonth() !== month - 1 ||
    birthday.getDate() !== day ||
    birthday > today
  ) {

    return null;

  }


  let age =
    today.getFullYear() - year;


  if (
    today.getMonth() < month - 1 ||
    (
      today.getMonth() === month - 1 &&
      today.getDate() < day
    )
  ) {

    age--;

  }


  return age;

}

function readForm() {

  const data =
    Object.fromEntries(

      Object.keys(defaults)

        .filter(
          key =>
            key !== 'preferences'
        )

        .map(
          key => {

            const field =
              document.querySelector(
                `[name="${key}"]`
              );

            return [
              key,
              field
                ? field.value
                : ''
            ];

          }
        )

    );


  data.preferences =
    Object.fromEntries(

      [
        ...app.querySelectorAll(
          '[data-preference]:checked'
        )
      ]

      .map(
        input => [

          input.dataset.preference,

          input.value

        ]
      )

    );


  return data;

}

            </div>

          </section>


          <section
            class="preferences"
            aria-labelledby="preferences-heading"
          >

            <div class="preferences-heading">

              <h3 id="preferences-heading">

                ${escapeHtml(
                  t('preferences')
                )}

              </h3>

              <p>

                ${escapeHtml(
                  t('preferencesDescription')
                )}

              </p>

            </div>


            <div class="preference-list">

              ${preferenceFields()}

            </div>

          </section>

        </div>


        <div class="actions">

          <button
            id="export-image"
            class="export-button"
            type="button"
          >

            ${escapeHtml(
              t('exportImage')
            )}

          </button>


          <button
            id="create-link"
            type="button"
          >

            ${escapeHtml(
              t('createLink')
            )}

          </button>


          <div class="share-row">

            <input
              id="share-link"
              readonly
              aria-label="${escapeHtml(
                t('createLink')
              )}"
              placeholder="${escapeHtml(
                t('sharePlaceholder')
              )}"
            >

            <button
              id="copy-link"
              class="secondary"
              type="button"
            >

              ${escapeHtml(
                t('copyLink')
              )}

            </button>

          </div>


          <p class="hint">

            ${escapeHtml(
              t('linkHint')
            )}

          </p>

        </div>

      </section>


      <section>

        <p class="preview-label">

          ${escapeHtml(
            t('livePreview')
          )}

        </p>

        <div id="preview"></div>

      </section>

    </div>

  `;


  app
    .querySelectorAll(
      'input, select, textarea'
    )
    .forEach(
      field =>
        field.addEventListener(
          'input',
          updatePreview
        )
    );


  app
    .querySelector(
      '#export-image'
    )
    .addEventListener(
      'click',
      exportImage
    );


  app
    .querySelector(
      '#create-link'
    )
    .addEventListener(
      'click',
      createLink
    );


  app
    .querySelector(
      '#copy-link'
    )
    .addEventListener(
      'click',
      copyLink
    );


  updatePreview();

}


/* =========================================================
   CREATE LINK
========================================================= */

function createLink() {

  const data =
    readForm();


  if (
    ageFromBirthdate(
      data.birthdate
    ) === null
  ) {

    return alert(
      t('invalidBirthdate')
    );

  }


  const encoded =
    encode(data);


  const link =
    `${location.href.split('#')[0]}#a=${encoded}`;


  const shareInput =
    app.querySelector(
      '#share-link'
    );


  if (shareInput) {

    shareInput.value =
      link;

  }


  copyText(
    link,
    t('linkCreated')
  );

}


/* =========================================================
   COPY
========================================================= */

async function copyText(
  text,
  success
) {

  try {

    await navigator.clipboard.writeText(
      text
    );

    if (success) {

      alert(success);

    }

  } catch {

    const input =
      app.querySelector(
        '#share-link'
      );


    if (input) {

      input.focus();
      input.select();

      alert(
        t('copyFallback')
      );

    }

  }

}


/* =========================================================
   IMAGE FILENAME
========================================================= */

function imageFileName(name) {

  const fallback =
    currentLanguage === 'en'
      ? 'slave-id-card'
      : 'sklaven-ausweis';


  const safeName =
    (
      name.trim() ||
      fallback
    )

      .replace(
        /[^\wäöüÄÖÜß-]+/g,
        '_'
      )

      .replace(
        /^_+|_+$/g,
        ''
      );


  return `${
    safeName ||
    fallback
  }-card.png`;

}

/* =========================================================
   EXPORT IMAGE
========================================================= */

async function exportImage(
  data = readForm()
) {

  const button =
    app.querySelector(
      '#export-image'
    );


  const source =
    app.querySelector(
      '#preview .card'
    ) ||
    app.querySelector(
      '.shared-view .card'
    );


  if (!source) return;


  const width =
    Math.max(
      560,
      Math.ceil(
        source.getBoundingClientRect().width
      )
    );


  const height =
    Math.ceil(
      source.getBoundingClientRect().height
    );


  const scale = 2;


  if (button) {

    button.disabled = true;

    button.textContent =
      t('creatingImage');

  }


  try {

    const svg = `

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="${width}"
        height="${height}"
        viewBox="0 0 ${width} ${height}"
      >

        <foreignObject
          width="100%"
          height="100%"
        >

          <div
            xmlns="http://www.w3.org/1999/xhtml"
          >

            <style>
              ${cardExportStyles()}
            </style>

            ${source.outerHTML}

          </div>

        </foreignObject>

      </svg>

    `;


    const image =
      new Image();


    const svgUrl =
      URL.createObjectURL(

        new Blob(
          [svg],
          {
            type:
              'image/svg+xml;charset=utf-8'
          }
        )

      );


    await new Promise(
      (resolve,reject) => {

        image.onload =
          resolve;

        image.onerror =
          reject;

        image.src =
          svgUrl;

      }
    );


    const canvas =
      document.createElement(
        'canvas'
      );


    canvas.width =
      width * scale;

    canvas.height =
      height * scale;


    const context =
      canvas.getContext(
        '2d'
      );


    context.scale(
      scale,
      scale
    );


    context.drawImage(
      image,
      0,
      0
    );


    URL.revokeObjectURL(
      svgUrl
    );


    const link =
      document.createElement(
        'a'
      );


    link.href =
      canvas.toDataURL(
        'image/png'
      );


    link.download =
      imageFileName(
        data.name
      );


    link.click();


  } catch {

    alert(
      t('imageError')
    );

  } finally {

    if (button) {

      button.disabled =
        false;

      button.textContent =
        t('exportImage');

    }

  }

}

/* =========================================================
   SHARED DATA
========================================================= */

function sharedData() {

  /*
    Supports:

      #a=...
      #ausweis=...
  */

  const match =
    location.hash.match(
      /^#(?:a|ausweis)=([^&]+)$/
    );


  if (!match) {

    return null;

  }


  try {

    const data =
      decode(
        match[1]
      );


    /*
      Language stored inside link.
    */

    currentLanguage =
      data.language === 'de'
        ? 'de'
        : 'en';


    document.documentElement.lang =
      currentLanguage;


    const sanitized =
      Object.fromEntries(

        Object.keys(defaults)

          .filter(
            key =>
              key !== 'preferences'
          )

          .map(
            key => [

              key,

              typeof data[key] === 'string'
                ? data[key]
                : defaults[key]

            ]
          )

      );


    if (
      sanitized.gender === 'Freitext' &&
      typeof data.genderCustom === 'string'
    ) {

      sanitized.gender =
        data.genderCustom;

    }


    if (
      ageFromBirthdate(
        sanitized.birthdate
      ) === null
    ) {

      return null;

    }


    sanitized.preferences =
      Object.fromEntries(

        Object.entries(
          data.preferences || {}
        )

        .filter(
          ([key,value]) =>

            /^\d+$/.test(key) &&

            Number(key) <
              preferenceQuestions.length &&

            preferenceChoices.includes(
              value
            )
        )

      );


    return sanitized;

  } catch {

    return null;

  }

}
