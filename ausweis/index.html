<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root { color-scheme: dark; --ink:#f7f2ff; --muted:#cbc1d8; --panel:#211a2d; --line:#59456d; --violet:#bb80ff; --violet-dark:#783bc1; --pink:#ff78ab; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 10% 0%,#61357f 0,transparent 32rem),radial-gradient(circle at 100% 100%,#54223f 0,transparent 28rem),#100d16; }
    main { width:min(1050px,calc(100% - 2rem)); margin:auto; padding:3rem 0 4rem; }
    header { text-align:center; max-width:760px; margin:0 auto 2rem; }
    .eyebrow { margin:0 0 .6rem; color:var(--violet); font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-size:.8rem; }
    h1 { margin:0; font-size:clamp(2.5rem,7vw,5rem); letter-spacing:-.06em; line-height:1; }
    header > p:last-child { color:var(--muted); }
    .notice, .editor, .shared-view { border:1px solid var(--line); border-radius:24px; background:rgba(33,26,45,.93); box-shadow:0 22px 60px #0006; }
    .notice { padding:1rem 1.2rem; margin-bottom:1.4rem; color:var(--muted); }
    .editor { display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,.9fr); gap:1.5rem; padding:1.5rem; }
    h2 { margin:0 0 1rem; font-size:1.45rem; }
    .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }
    label { display:grid; gap:.4rem; color:var(--muted); font-weight:700; }
    label.full { grid-column:1 / -1; }
    input, select, textarea { width:100%; color:var(--ink); background:#140f1c; border:1px solid var(--line); border-radius:12px; padding:.75rem .85rem; font:inherit; }
    textarea { resize:vertical; min-height:96px; }
    input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
    .preview-label { color:var(--muted); margin:0 0 .7rem; font-size:.9rem; font-weight:800; text-transform:uppercase; letter-spacing:.09em; }
    .card { position:relative; overflow:hidden; min-height:400px; padding:1.5rem; border:1px solid #d6afff; border-radius:22px; color:#24132e; background:linear-gradient(135deg,#f8eaff,#c699f6 49%,#ffb3cf); box-shadow:0 18px 36px #0004; }
    .card:before { content:""; position:absolute; width:260px; height:260px; border:35px solid #ffffff55; border-radius:50%; right:-90px; top:-105px; }
    .card > * { position:relative; }
    .card-top { display:flex; justify-content:space-between; gap:1rem; align-items:start; border-bottom:1px solid #4b216466; padding-bottom:.9rem; }
    .card-kicker { margin:0; color:#592a7e; font-size:.72rem; font-weight:900; letter-spacing:.13em; text-transform:uppercase; }
    .card-title { margin:.2rem 0 0; font-size:1.6rem; line-height:1; }
    .badge { display:grid; place-items:center; width:54px; aspect-ratio:1; border-radius:50%; background:#40155c; color:#fff; font-weight:900; font-size:1.3rem; }
    .identity { display:grid; grid-template-columns:92px 1fr; gap:1rem; margin:1.4rem 0; align-items:center; }
    .avatar { display:grid; place-items:center; width:92px; aspect-ratio:1; border-radius:18px; background:#51206d; color:white; font-size:2rem; font-weight:900; }
    .name { margin:0; font-size:clamp(1.6rem,5vw,2.45rem); line-height:1; overflow-wrap:anywhere; }
    .role { margin:.4rem 0 0; font-weight:800; color:#54226e; }
    .details { display:grid; gap:.75rem; }
    .detail { padding:.65rem .75rem; border-radius:12px; background:#fff8; }
    .detail strong { display:block; color:#582276; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; }
    .detail span { overflow-wrap:anywhere; }
    .preferences { grid-column:1 / -1; padding:1rem; border:1px solid var(--line); border-radius:16px; background:#191221; }
    .preferences h3 { margin:0; font-size:1.08rem; color:var(--ink); }
    .preferences > p { margin:.25rem 0 1rem; color:var(--muted); font-size:.9rem; }
    .preference-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.7rem; max-height:520px; overflow:auto; padding-right:.35rem; }
    .preference { display:flex; align-items:center; justify-content:space-between; gap:.65rem; padding:.55rem .65rem; border-radius:10px; background:#140f1c; color:var(--ink); font-size:.9rem; }
    .preference span { overflow-wrap:anywhere; }
    .preference select { width:auto; min-width:130px; padding:.45rem; font-size:.82rem; }
    .card-preferences { margin-top:.75rem; }
    .card-preferences ul { display:flex; flex-wrap:wrap; gap:.45rem; margin:.5rem 0 0; padding:0; list-style:none; }
    .card-preferences li { padding:.3rem .5rem; border-radius:999px; background:#fff8; font-size:.78rem; }
    .actions { display:grid; gap:.75rem; margin-top:1.25rem; }
    .share-row { display:flex; gap:.65rem; }
    button,.link-button { border:0; border-radius:999px; padding:.85rem 1.1rem; background:linear-gradient(135deg,var(--violet),var(--violet-dark)); color:white; cursor:pointer; font:inherit; font-weight:850; text-align:center; text-decoration:none; }
    button.secondary { background:#32243f; border:1px solid var(--line); }
    .share-row input { min-width:0; }
    .hint { margin:0; color:var(--muted); font-size:.88rem; }
    .shared-view { max-width:560px; margin:auto; padding:1.5rem; }
    .shared-view .card { margin:1.2rem 0; }
    .hidden { display:none; }
    @media(max-width:760px) { main{padding-top:2rem}.editor{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.preference-list{grid-template-columns:1fr;max-height:460px}.share-row{flex-direction:column}.share-row button{width:100%} }
  </style>
</head>
<body>

    const app = document.querySelector('#app');

    function escapeHtml(value) { return String(value || '').replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]); }
    function encode(data) { const bytes = new TextEncoder().encode(JSON.stringify(data)); let binary = ''; bytes.forEach(byte => binary += String.fromCharCode(byte)); return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
    function decode(value) { const base64 = value.replace(/-/g,'+').replace(/_/g,'/') + '='.repeat((4 - value.length % 4) % 4); return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(base64), char => char.charCodeAt(0)))); }
    function initials(name) { return (name.trim().split(/\s+/).map(word => word[0]).join('').slice(0,2) || 'K').toUpperCase(); }
    function selectedPreferences(data) { return preferenceQuestions.map((question, index) => [question, data.preferences?.[index]]).filter(([, answer]) => preferenceChoices.includes(answer)); }
    function card(data) {
      const name = data.name.trim() || 'Dein Name';
      const selections = selectedPreferences(data);
      const preferenceHtml = selections.length ? `<div class="detail card-preferences"><strong>Vorlieben & Grenzen</strong><ul>${selections.map(([question, answer]) => `<li>${escapeHtml(question)}: <b>${escapeHtml(answer)}</b></li>`).join('')}</ul></div>` : '';

    }
    function readForm() {
      const data = Object.fromEntries(Object.keys(defaults).filter(key => key !== 'preferences').map(key => [key, document.querySelector(`[name="${key}"]`).value]));
      data.preferences = Object.fromEntries([...app.querySelectorAll('[data-preference]')].filter(select => select.value).map(select => [select.dataset.preference, select.value]));
      return data;
    }
    function updatePreview() { document.querySelector('#preview').innerHTML = card(readForm()); }
    function preferenceFields() { return preferenceQuestions.map((question, index) => `<label class="preference"><span>${escapeHtml(question)}</span><select data-preference="${index}" aria-label="${escapeHtml(question)}"><option value="">Bitte wählen</option>${preferenceChoices.map(choice => `<option>${escapeHtml(choice)}</option>`).join('')}</select></label>`).join(''); }
    function renderEditor() {
      app.innerHTML = `<div class="editor"><section><h2>Deinen Ausweis gestalten</h2><div class="fields"><label>Spitzname<input name="name" maxlength="50" placeholder="z. B. Raven"></label><label>Rolle<select name="role"><option>Submissive</option><option>Dominant</option><option>Switch</option><option>Entdeckend</option><option>Andere</option></select></label><label>Pronomen<input name="pronouns" maxlength="50" placeholder="z. B. sie/ihr"></label><label>Safeword<input name="safeword" maxlength="50" placeholder="z. B. Rot"></label><label class="full">Interessen<textarea name="interests" maxlength="300" placeholder="Was möchtest du zeigen?"></textarea></label><label class="full">Grenzen<textarea name="boundaries" maxlength="300" placeholder="Was ist für dich wichtig oder ausgeschlossen?"></textarea></label><section class="preferences" aria-labelledby="preferences-heading"><h3 id="preferences-heading">Vorlieben & Grenzen</h3><p>Bewerte jede gewünschte Praktik. Unbeantwortete Fragen erscheinen nicht auf deinem Ausweis.</p><div class="preference-list">${preferenceFields()}</div></section></div><div class="actions"><button id="create-link" type="button">Ergebnis-Link erstellen</button><div class="share-row"><input id="share-link" readonly aria-label="Teilbarer Ergebnis-Link" placeholder="Der Link erscheint hier"><button id="copy-link" class="secondary" type="button">Link kopieren</button></div><p class="hint">Der Link enthält diese Angaben. Jede Person mit dem Link kann sie sehen.</p></div></section><section><p class="preview-label">Live-Vorschau</p><div id="preview"></div></section></div>`;
      app.querySelectorAll('input, select, textarea').forEach(field => field.addEventListener('input', updatePreview));
      app.querySelector('#create-link').addEventListener('click', createLink);
      app.querySelector('#copy-link').addEventListener('click', copyLink);
      updatePreview();
    }
    function createLink() { const link = `${location.href.split('#')[0]}#ausweis=${encode(readForm())}`; app.querySelector('#share-link').value = link; copyText(link, 'Der Ergebnis-Link wurde erstellt und kopiert.'); }
    async function copyText(text, success) { try { await navigator.clipboard.writeText(text); if (success) alert(success); } catch { const input = app.querySelector('#share-link'); input.focus(); input.select(); if (success) alert('Der Link wurde erstellt. Bitte kopiere ihn aus dem Feld.'); } }
    function copyLink() { const link = app.querySelector('#share-link').value; if (!link) return alert('Erstelle zuerst einen Ergebnis-Link.'); copyText(link, 'Der Link wurde kopiert.'); }
    function sharedData() {
      const match = location.hash.match(/^#ausweis=([^&]+)$/); if (!match) return null;
      try {
        const data = decode(match[1]);
        const sanitized = Object.fromEntries(Object.keys(defaults).filter(key => key !== 'preferences').map(key => [key, typeof data[key] === 'string' ? data[key] : defaults[key]]));

      } catch { return null; }

    const data = sharedData();
    if (data) renderShared(data); else renderEditor();
  </script>
</body>
</html>
