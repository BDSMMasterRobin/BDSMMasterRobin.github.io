<!doctype html>

  <style>
    :root { color-scheme: dark; --ink:#f7f2ff; --muted:#cbc1d8; --panel:#211a2d; --line:#59456d; --violet:#bb80ff; --violet-dark:#783bc1; --pink:#ff78ab; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; overflow-x:clip; color:var(--ink); font:16px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 10% 0%,#61357f 0,transparent 32rem),radial-gradient(circle at 100% 100%,#54223f 0,transparent 28rem),#100d16; }

    .notice, .editor, .shared-view { border:1px solid var(--line); border-radius:24px; background:rgba(33,26,45,.93); box-shadow:0 22px 60px #0006; }

    .editor { display:grid; grid-template-columns:minmax(650px,1.25fr) minmax(420px,.75fr); gap:clamp(1.5rem,3vw,3rem); padding:clamp(1.5rem,3vw,3rem); }
    h2 { margin:0 0 1rem; font-size:1.45rem; }
    .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }
    label { display:grid; gap:.4rem; color:var(--muted); font-weight:700; }
    label.full { grid-column:1 / -1; }
    input, select, textarea { width:100%; color:var(--ink); background:#140f1c; border:1px solid var(--line); border-radius:12px; padding:.75rem .85rem; font:inherit; }
    textarea { resize:vertical; min-height:96px; }
    input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
    .preview-label { color:var(--muted); margin:0 0 .7rem; font-size:.9rem; font-weight:800; text-transform:uppercase; letter-spacing:.09em; }
    .card { position:relative; overflow:hidden; min-height:400px; padding:1.5rem; border:1px solid #d6afff; border-radius:22px; color:#24132e; background:linear-gradient(135deg,#f8eaff,#c699f6 49%,#ffb3cf); box-shadow:0 18px 36px #0004; }
    .card:before { content:""; position:absolute; width:260px; height:260px; border:35px solid #ffffff55; border-radius:50%; right:-90px; top:-105px; }
    .card > * { position:relative; }
    .card-top { display:flex; justify-content:space-between; gap:1rem; align-items:start; border-bottom:1px solid #4b216466; padding-bottom:.9rem; }
    .card-kicker { margin:0; color:#592a7e; font-size:.72rem; font-weight:900; letter-spacing:.13em; text-transform:uppercase; }
    .card-title { margin:.2rem 0 0; font-size:1.6rem; line-height:1; }
    .badge { display:grid; place-items:center; width:54px; aspect-ratio:1; border-radius:50%; background:#40155c; color:#fff; font-weight:900; font-size:1.3rem; }
    .identity { display:grid; grid-template-columns:92px 1fr; gap:1rem; margin:1.4rem 0; align-items:center; }
    .avatar { display:grid; place-items:center; width:92px; aspect-ratio:1; border-radius:18px; background:#51206d; color:white; font-size:2rem; font-weight:900; }
    .name { margin:0; font-size:clamp(1.6rem,5vw,2.45rem); line-height:1; overflow-wrap:anywhere; }
    .role { margin:.4rem 0 0; font-weight:800; color:#54226e; }

    .detail strong { display:block; color:#582276; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; }
    .detail span { overflow-wrap:anywhere; }
    .preferences { grid-column:1 / -1; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#101827; }
    .social-media-fields { padding:1rem; }
    .preferences-heading { padding:.85rem 1rem; border-bottom:1px solid #344155; background:#1d2939; }
    .preferences h3 { margin:0; font-size:1.08rem; color:var(--ink); }
    .preferences-heading p { margin:.25rem 0 0; color:var(--muted); font-size:.84rem; }
    .preference-list { max-height:520px; overflow:auto; }
    .preference-table { width:100%; min-width:650px; border-collapse:collapse; font-size:.9rem; }
    .preference-table th { padding:.35rem .5rem; color:var(--ink); font-size:.78rem; text-align:center; font-weight:800; }
    .preference-table th:first-child { width:100%; text-align:left; }
    .preference-table td { border-top:1px solid #344155; }
    .preference-name { padding:.48rem .5rem; color:var(--ink); overflow-wrap:anywhere; }
    .preference-option { width:2.1rem; padding:.3rem .1rem; text-align:center; }
    .preference-option label { display:grid; place-items:center; color:var(--ink); cursor:pointer; }
    .preference-option input { position:absolute; inline-size:1px; block-size:1px; opacity:0; }
    .preference-dot { width:19px; aspect-ratio:1; border:1px solid currentColor; border-radius:50%; transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
    .preference-option label:hover .preference-dot { transform:scale(1.13); }
    .preference-option input:focus-visible + .preference-dot { outline:2px solid var(--ink); outline-offset:3px; }
    .preference-option input:checked + .preference-dot { background:currentColor; box-shadow:inset 0 0 0 3px #101827; }

    .preference-option[data-choice="schwere Strafe"] { color:#8b5cf6; }
    .preference-option[data-choice="muss nicht sein"] { color:#db2777; }

    .preference-option[data-choice="wäre schön"] { color:#d97706; }

    .card-social-media li { padding:.3rem .5rem; border-radius:999px; background:#fff8; font-size:.78rem; overflow-wrap:anywhere; }
    .card-preferences { margin-top:.75rem; }
    .card-preferences ul { display:flex; flex-wrap:wrap; gap:.45rem; margin:.5rem 0 0; padding:0; list-style:none; }
    .card-preferences li { padding:.3rem .5rem; border-radius:999px; background:#fff8; font-size:.78rem; }
    .actions { display:grid; gap:.75rem; margin-top:1.25rem; }
    .share-row { display:flex; gap:.65rem; }
    button,.link-button { border:0; border-radius:999px; padding:.85rem 1.1rem; background:linear-gradient(135deg,var(--violet),var(--violet-dark)); color:white; cursor:pointer; font:inherit; font-weight:850; text-align:center; text-decoration:none; }
    button.secondary { background:#32243f; border:1px solid var(--line); }
    .share-row input { min-width:0; }
    .hint { margin:0; color:var(--muted); font-size:.88rem; }
    .shared-view { max-width:560px; margin:auto; padding:1.5rem; }
    .shared-view .card { margin:1.2rem 0; }
    .hidden { display:none; }
    @media(max-width:1250px) { main{width:min(1050px,calc(100% - 2rem));padding-top:2rem}.editor{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.preference-list{max-height:460px}.share-row{flex-direction:column}.share-row button{width:100%} }
    @media(max-width:560px) {
      main { width:100%; padding:1.25rem .75rem 2rem; }
      .editor { gap:1rem; padding:1rem; border-radius:18px; }
      .card { padding:1rem; }
      .preference-table { min-width:0; table-layout:fixed; font-size:.72rem; }
      .preference-table th { padding:.35rem .1rem; font-size:.62rem; line-height:1.15; overflow-wrap:anywhere; }
      .preference-table th:first-child { width:calc(100% - 9rem); }
      .preference-name { padding:.45rem .35rem; line-height:1.2; }
      .preference-option { width:1.5rem; padding:.25rem 0; }
      .preference-dot { width:16px; }
    }
  </style>
</head>

    function encode(data) { const bytes = new TextEncoder().encode(JSON.stringify(data)); let binary = ''; bytes.forEach(byte => binary += String.fromCharCode(byte)); return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

      if (today.getMonth() < month - 1 || (today.getMonth() === month - 1 && today.getDate() < day)) age -= 1;
      return age;

      const data = Object.fromEntries(Object.keys(defaults).filter(key => key !== 'preferences').map(key => [key, document.querySelector(`[name="${key}"]`).value]));

      const match = location.hash.match(/^#ausweis=([^&]+)$/); if (!match) return null;

    const data = sharedData();
    if (data) renderShared(data); else renderEditor();
